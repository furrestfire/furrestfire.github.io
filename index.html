<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>furrestfire // frozen forest</title>
<meta name="description" content="FurrestFire — the coolest, the ultimate, the best. Walk into the frozen forest.">
<meta name="theme-color" content="#050a0d">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="furrestfire // frozen forest">
<meta property="og:description" content="The coolest person on this node. Click the light between the trees.">
<style>
  :root{
    --ink:#050a0d;
    --ice:#eaf6fa;
    --fog:#9fc3cf;
    --dim:#7ea3b1;
    --line:rgba(190,225,235,.16);
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    --sans:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--ice);overflow:hidden}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;cursor:none}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

  .grade{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 40%,rgba(2,7,10,.62) 100%),
      linear-gradient(180deg,rgba(4,12,18,.35) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 72%,rgba(2,8,11,.55) 100%);
  }
  .frame{position:fixed;inset:18px;z-index:4;pointer-events:none}
  .frame i{position:absolute;width:26px;height:26px;border:1px solid var(--line)}
  .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
  .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
  .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

  .title-block{
    position:fixed;left:7vw;top:24vh;z-index:5;max-width:none;
    opacity:0;transform:translateY(18px);
    animation:blockIn 1.6s cubic-bezier(.2,.7,.2,1) .25s forwards;
  }
  .eyebrow{
    font:400 10px/1 var(--mono);letter-spacing:.44em;text-transform:uppercase;
    color:var(--dim);margin:0 0 26px;display:flex;align-items:center;gap:14px;
  }
  .eyebrow::before{content:"";width:34px;height:1px;background:var(--line)}
  h1{
    margin:0;font-weight:200;text-transform:uppercase;white-space:nowrap;
    font-size:clamp(32px,9vw,140px);line-height:.94;letter-spacing:.04em;
    color:var(--ice);
    text-shadow:0 0 70px rgba(150,215,235,.35),-1px 0 0 rgba(110,205,240,.30),1px 0 0 rgba(255,150,190,.14);
  }
  h1 .ltr{display:inline-block;opacity:0;filter:blur(16px);transform:translateY(22px);
    animation:letterIn 1.5s cubic-bezier(.16,.75,.2,1) forwards}
  .sub{
    margin:30px 0 0;font-weight:200;font-size:clamp(15px,1.45vw,20px);line-height:1.7;
    color:#c2dbe4;max-width:30ch;letter-spacing:.01em;
    opacity:0;animation:blockIn 1.4s ease 1.5s forwards;
  }
  .sub b{font-weight:400;color:var(--ice)}

  .gate{
    position:fixed;left:63%;top:46%;transform:translate(-50%,-50%);
    width:230px;height:360px;z-index:6;border:0;background:none;padding:0;
    cursor:none;display:grid;place-items:center;
    opacity:0;animation:blockIn 2s ease 2.1s forwards;
  }
  .gate .shaft{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 46%,rgba(214,246,255,.30) 0%,rgba(190,235,248,.10) 42%,rgba(190,235,248,0) 74%);
    filter:none;opacity:.75;animation:breathe 7.5s ease-in-out infinite;
  }
  .gate .edge{
    position:absolute;left:50%;top:14%;width:1px;height:72%;transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(235,250,255,0),rgba(235,250,255,.55) 35%,rgba(235,250,255,.55) 65%,rgba(235,250,255,0));
    opacity:.35;transition:opacity .6s ease,height .6s ease;
  }
  .gate .ring{
    position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;
    border:1px solid rgba(220,245,255,.34);border-radius:50%;
    opacity:0;transform:scale(.7);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .gate .label{
    position:absolute;left:50%;top:calc(50% + 54px);transform:translate(-50%,6px);
    font:400 9px/1 var(--mono);letter-spacing:.42em;text-transform:uppercase;white-space:nowrap;
    color:#dff2f8;opacity:0;transition:opacity .45s ease,transform .45s ease;
  }
  .gate:hover .shaft,.gate:focus-visible .shaft{opacity:1}
  .gate:hover .edge,.gate:focus-visible .edge{opacity:.85;height:78%}
  .gate:hover .ring,.gate:focus-visible .ring{opacity:1;transform:scale(1)}
  .gate:hover .label,.gate:focus-visible .label{opacity:.9;transform:translate(-50%,0)}
  .gate:focus-visible{outline:0}
  .gate.walking{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1.06)}

  .hint{
    position:fixed;left:50%;bottom:5.5vh;transform:translateX(-50%);z-index:5;margin:0;
    font:400 9px/1 var(--mono);letter-spacing:.4em;text-transform:uppercase;
    color:rgba(214,238,246,.5);text-align:center;white-space:nowrap;
    opacity:0;animation:blockIn 1.4s ease 2.6s forwards;
  }
  .hint span{animation:flicker 3.4s ease-in-out infinite}
  .sound{
    position:fixed;right:22px;bottom:22px;z-index:7;width:40px;height:40px;
    border:1px solid var(--line);background:rgba(8,18,24,.4);
    color:var(--dim);cursor:none;display:grid;place-items:center;
    transition:color .3s ease,border-color .3s ease,background .3s ease;
  }
  .sound:hover{color:var(--ice);border-color:rgba(210,240,250,.4)}
  .sound.on{color:var(--ice);background:rgba(40,80,95,.4);border-color:rgba(210,240,250,.45)}
  .sound svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2}

  #cursor{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;z-index:9;
    border-radius:50%;background:rgba(232,250,255,.85);
    box-shadow:0 0 14px rgba(180,235,250,.7);pointer-events:none;
    transition:width .2s,height .2s,margin .2s,background .2s}
  #cursor.hot{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:#fff}
  #ring{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:8;
    border:1px solid rgba(220,245,255,.20);border-radius:50%;pointer-events:none;
    transition:width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1),
               margin .35s cubic-bezier(.2,.8,.2,1),border-color .35s,opacity .3s}
  #ring.hot{width:96px;height:96px;margin:-48px 0 0 -48px;border-color:rgba(225,248,255,.55)}

  .veil{position:fixed;inset:0;z-index:20;background:#f2fbfd;pointer-events:none;opacity:.86}
  .veil.gone{opacity:0;transition:opacity 1.7s cubic-bezier(.3,.6,.3,1)}

  @keyframes blockIn{to{opacity:1;transform:none}}
  @keyframes letterIn{to{opacity:1;filter:blur(0);transform:none}}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes flicker{0%,100%{opacity:.5}48%{opacity:.5}52%{opacity:.95}56%{opacity:.6}}

  @media (max-width:760px){
    .title-block{left:8vw;right:8vw;top:16vh}
    h1{font-size:clamp(28px,8vw,68px);letter-spacing:0}
    .gate{left:50%;top:66%;width:200px;height:280px}
    .hint{font-size:8px;letter-spacing:.3em;bottom:4vh}
    .frame{inset:12px}
    body{cursor:auto}
    #cursor,#ring{display:none}
    .gate{cursor:pointer}
    .sound{cursor:pointer}
  }
  @media (hover:none){body{cursor:auto}#cursor,#ring{display:none}.gate,.sound{cursor:pointer}}
  @media (prefers-reduced-motion:reduce){
    .gate .shaft{animation:none;opacity:.85}
    .hint span{animation:none;opacity:.7}
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grade"></div>
<div class="frame"><i></i><i></i><i></i><i></i></div>

<header class="title-block">
  <p class="eyebrow">node 01 <span style="opacity:.4">/</span> frozen forest</p>
  <h1 id="name">FurrestFire</h1>
  <p class="sub">The coolest person on this node. Also the <b>ultimate best</b>. Click the light between the trees.</p>
</header>

<button class="gate" id="gate" aria-label="Walk into the forest">
  <span class="shaft"></span>
  <span class="edge"></span>
  <span class="ring"></span>
  <span class="label">walk in</span>
</button>

<p class="hint"><span>click the light between the trees</span></p>

<button class="sound" id="sound" aria-label="Toggle ambient sound" title="ambient">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3l5 4V5L7 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>
</button>

<div id="cursor" aria-hidden="true"></div>
<div id="ring" aria-hidden="true"></div>
<div class="veil" id="veil" aria-hidden="true"></div>

<noscript>
  <style>
    .title-block{opacity:1;transform:none}
    h1 .ltr{opacity:1;filter:none;transform:none}
    .sub,.gate,.hint{opacity:1}
    .veil{display:none}
    body{background:radial-gradient(80% 70% at 63% 46%,#1b3a45 0%,#0a1418 55%,#050a0d 100%)}
  </style>
</noscript>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', {alpha:false, desynchronized:true});
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  var W = 0, H = 0;

  function rng(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- snowy pine silhouette ---------- */
  function pinePath(seed){
    var r = rng(seed);
    var p = new Path2D();
    var trunkW = 0.026 + r() * 0.014;
    p.moveTo(-trunkW, 0.02);
    p.lineTo(-trunkW * 0.55, -0.86);
    p.lineTo(trunkW * 0.55, -0.86);
    p.lineTo(trunkW, 0.02);
    p.closePath();
    var tiers = 8;
    for (var i = 0; i < tiers; i++){
      var t = i / (tiers - 1);
      var y0 = -0.06 - t * 0.80;
      var half = (0.30 - t * 0.265) * (0.75 + r() * 0.5);
      var drop = 0.17 * (1 - t * 0.55);
      p.moveTo(-half * 0.16, y0);
      for (var s = 0; s <= 6; s++){
        var u = s / 6;
        p.lineTo(-half * u, y0 + drop * u + (r() - 0.5) * drop * 0.62);
      }
      p.lineTo(0, y0 + drop * 0.30);
      for (var s2 = 6; s2 >= 0; s2--){
        var u2 = s2 / 6;
        p.lineTo(half * u2, y0 + drop * u2 + (r() - 0.5) * drop * 0.62);
      }
      p.closePath();
    }
    return p;
  }

  /* ---------- scene data ---------- */
  var GAP = {x:0.63, y:0.46};
  var trees = [], flakes = [];
  var layers = [
    {depth:0.16, n:17, alpha:0.14, tint:[58,94,110], hMin:0.26, hMax:0.46, ground:0.60},
    {depth:0.38, n:12, alpha:0.30, tint:[34,68,82],  hMin:0.42, hMax:0.70, ground:0.64},
    {depth:0.66, n:8,  alpha:0.55, tint:[16,44,56],  hMin:0.62, hMax:0.98, ground:0.70},
    {depth:1.00, n:5,  alpha:0.94, tint:[5,20,28],   hMin:0.86, hMax:1.30, ground:0.78}
  ];
  var bakes = {sky:null, rays:null, ground:null, vignette:null, fog:null, trees:[]};

  function makeCanvas(){
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    return c;
  }

  function build(){
    trees = [];
    var r = rng(20711);
    layers.forEach(function(L, li){
      var fixed = li >= 2 ? (li === 3 ? [0.16, 0.34, 0.86, 1.02] : [0.08, 0.27, 0.52, 0.83, 0.97]) : null;
      var group = [];
      for (var i = 0; i < L.n; i++){
        var x;
        if (fixed) x = fixed[i % fixed.length] + (r() - 0.5) * 0.05;
        else {
          x = r();
          if (li >= 1 && x > GAP.x - 0.10 && x < GAP.x + 0.10) x += 0.16;
        }
        group.push({
          x: x, h: L.hMin + r() * (L.hMax - L.hMin),
          ground: L.ground + (r() - 0.5) * 0.03,
          alpha: L.alpha * (0.82 + r() * 0.36),
          tint: L.tint, path: pinePath(1000 + li * 97 + i * 13),
          lean: (r() - 0.5) * 0.03
        });
      }
      L.group = group;
      trees = trees.concat(group);
    });

    /* heavy snow */
    flakes = [];
    var nf = reduce ? 220 : (W < 760 ? 240 : 420);
    var rf = rng(5150);
    for (var f = 0; f < nf; f++){
      flakes.push({
        x: rf() * W, y: rf() * H, z: 0.1 + rf() * 0.9,
        vy: 24 + rf() * 60, vx: (rf() - 0.5) * 20,
        s: 0.8 + rf() * 2.6, a: 0.3 + rf() * 0.6, ph: rf() * 6.28
      });
    }
  }

  /* ---------- static bakes: rendered once, then blitted ---------- */
  function bakeSky(){
    var c = makeCanvas(), g = c.getContext('2d');
    g.scale(DPR, DPR);
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#071219'); sky.addColorStop(0.34, '#0b1c24');
    sky.addColorStop(0.72, '#0d222b'); sky.addColorStop(1, '#050b0f');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);

    var gx = W * GAP.x, gy = H * GAP.y;
    g.globalCompositeOperation = 'screen';
    var r = g.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.62);
    r.addColorStop(0, 'rgba(214,244,255,0.34)');
    r.addColorStop(0.18, 'rgba(168,222,238,0.16)');
    r.addColorStop(0.46, 'rgba(120,180,200,0.06)');
    r.addColorStop(1, 'rgba(120,180,200,0)');
    g.fillStyle = r; g.fillRect(0, 0, W, H);

    var shaft = g.createLinearGradient(0, gy - H * 0.5, 0, gy + H * 0.35);
    shaft.addColorStop(0, 'rgba(226,248,255,0.26)');
    shaft.addColorStop(0.5, 'rgba(206,240,252,0.14)');
    shaft.addColorStop(1, 'rgba(206,240,252,0)');
    g.fillStyle = shaft;
    g.beginPath();
    g.moveTo(gx - W * 0.035, gy - H * 0.52);
    g.lineTo(gx + W * 0.035, gy - H * 0.52);
    g.lineTo(gx + W * 0.105, gy + H * 0.36);
    g.lineTo(gx - W * 0.105, gy + H * 0.36);
    g.closePath(); g.fill();
    return c;
  }

  function bakeRays(){
    var c = makeCanvas(), g = c.getContext('2d');
    g.scale(DPR, DPR);
    g.globalCompositeOperation = 'screen';
    for (var i = 0; i < 7; i++){
      var ang = -0.44 + i * 0.15;
      g.save();
      g.translate(W * GAP.x, H * GAP.y);
      g.rotate(ang);
      var grad = g.createLinearGradient(0, -H * 0.55, 0, H * 0.55);
      grad.addColorStop(0, 'rgba(215,245,255,0.075)');
      grad.addColorStop(0.55, 'rgba(205,238,250,0.045)');
      grad.addColorStop(1, 'rgba(205,238,250,0)');
      g.fillStyle = grad;
      for (var k = 0; k < 3; k++){
        var w = W * (0.012 + k * 0.014);
        g.globalAlpha = 1 - k * 0.30;
        g.fillRect(-w / 2, -H * 0.55, w, H * 1.1);
      }
      g.restore();
    }
    return c;
  }

  function bakeTreeLayer(L){
    var c = makeCanvas(), g = c.getContext('2d');
    g.scale(DPR, DPR);
    L.group.forEach(function(tr){
      var hgt = H * tr.h, wid = hgt * 0.46;
      g.save();
      g.translate(W * tr.x, H * tr.ground);
      g.rotate(tr.lean);
      g.scale(wid, hgt);
      g.globalAlpha = tr.alpha;
      g.fillStyle = 'rgb(' + tr.tint[0] + ',' + tr.tint[1] + ',' + tr.tint[2] + ')';
      g.fill(tr.path);
      if (L.depth > 0.6){
        g.globalAlpha = tr.alpha * 0.22;
        g.strokeStyle = 'rgba(190,232,245,0.9)';
        g.lineWidth = 0.005;
        g.stroke(tr.path);
      }
      g.restore();
    });
    return c;
  }

  function bakeGround(){
    var c = makeCanvas(), g = c.getContext('2d');
    g.scale(DPR, DPR);
    var gy = H * 0.80;
    var grad = g.createLinearGradient(0, gy - H * 0.10, 0, H);
    grad.addColorStop(0, 'rgba(9,24,31,0)');
    grad.addColorStop(0.45, 'rgba(7,20,27,0.85)');
    grad.addColorStop(1, 'rgba(3,10,14,1)');
    g.fillStyle = grad;
    g.fillRect(0, gy - H * 0.1, W, H - gy + H * 0.1);
    g.globalCompositeOperation = 'screen';
    var gx = W * GAP.x;
    var rg = g.createRadialGradient(gx, gy + H * 0.04, 0, gx, gy + H * 0.04, W * 0.34);
    rg.addColorStop(0, 'rgba(190,236,248,0.18)');
    rg.addColorStop(1, 'rgba(190,236,248,0)');
    g.fillStyle = rg;
    g.fillRect(gx - W * 0.34, gy - H * 0.06, W * 0.68, H * 0.34);
    return c;
  }

  function bakeFog(){
    var tw = Math.round(W * DPR * 1.4), th = Math.round(H * 0.34 * DPR);
    var c = document.createElement('canvas');
    c.width = tw; c.height = th;
    var g = c.getContext('2d');
    g.globalCompositeOperation = 'screen';
    var rg = g.createRadialGradient(tw * 0.3, th * 0.5, 0, tw * 0.3, th * 0.5, tw * 0.34);
    rg.addColorStop(0, 'rgba(168,208,224,0.22)');
    rg.addColorStop(1, 'rgba(168,208,224,0)');
    g.fillStyle = rg; g.fillRect(0, 0, tw, th);
    var rg2 = g.createRadialGradient(tw * 0.78, th * 0.55, 0, tw * 0.78, th * 0.55, tw * 0.28);
    rg2.addColorStop(0, 'rgba(180,218,232,0.18)');
    rg2.addColorStop(1, 'rgba(180,218,232,0)');
    g.fillStyle = rg2; g.fillRect(0, 0, tw, th);
    g.globalCompositeOperation = 'destination-in';
    var mask = g.createLinearGradient(0, 0, 0, th);
    mask.addColorStop(0, 'rgba(0,0,0,0)');
    mask.addColorStop(0.5, 'rgba(0,0,0,1)');
    mask.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mask; g.fillRect(0, 0, tw, th);
    return {canvas:c, w:tw};
  }

  function bakeVignette(){
    var c = makeCanvas(), g = c.getContext('2d');
    g.scale(DPR, DPR);
    var v = g.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.28, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.72)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    var noise = document.createElement('canvas');
    noise.width = noise.height = 180;
    var nctx = noise.getContext('2d');
    var img = nctx.createImageData(180, 180);
    var rn = rng(99);
    for (var k = 0; k < img.data.length; k += 4){
      var val = 150 + rn() * 105;
      img.data[k] = img.data[k + 1] = img.data[k + 2] = val;
      img.data[k + 3] = 20 + rn() * 26;
    }
    nctx.putImageData(img, 0, 0);
    g.globalAlpha = 0.5;
    g.fillStyle = g.createPattern(noise, 'repeat');
    g.fillRect(0, 0, W, H);
    /* scanlines baked in — no blend-mode layer at runtime */
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(255,255,255,0.022)';
    for (var sy = 0; sy < H; sy += 3) g.fillRect(0, sy, W, 1);
    return c;
  }

  function bakeAll(){
    bakes.sky = bakeSky();
    bakes.rays = bakeRays();
    bakes.ground = bakeGround();
    bakes.vignette = bakeVignette();
    bakes.fog = bakeFog();
    bakes.trees = layers.map(function(L){ return {canvas:bakeTreeLayer(L), depth:L.depth}; });
  }

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    build();
    bakeAll();
    if (gate) placeGate();
  }

  /* ---------- state ---------- */
  var FF = {walkP:0, walking:false, navReady:false, noNav:false, sound:false};
  var walk = {start:0, dur:2500, active:false};
  var pointer = {x:0.5, y:0.5, tx:0.5, ty:0.5};
  var veil = document.getElementById('veil');
  var gate = document.getElementById('gate');
  var hintEl = document.querySelector('.hint');
  var titleEl = document.querySelector('.title-block');

  function placeGate(){
    gate.style.left = (GAP.x * 100) + '%';
    gate.style.top = (GAP.y * 100) + '%';
  }

  /* ---------- per-frame: bitmap compositing only ---------- */
  function draw(t){
    FF.frames = (FF.frames || 0) + 1;
    var p = FF.walkP;
    var ease = p < 0.55 ? Math.pow(p / 0.55, 1.5) * 0.55 : 0.55 + (p - 0.55) * 1.1;
    var breathe = reduce ? 0 : Math.sin(t * 0.00028) * 0.012;
    var bob = reduce ? 0 : (Math.sin(t * 0.0075) * 2.4 + Math.sin(t * 0.0017) * 1.6) + (p > 0 ? Math.sin(t * 0.019) * 7 * p : 0);
    var roll = reduce ? 0 : Math.sin(t * 0.0009) * 0.0022 + (p > 0 ? Math.sin(t * 0.019 + 1) * 0.006 * p : 0);
    var px = (pointer.x - 0.5) * 22 * (1 - p), py = (pointer.y - 0.5) * 14 * (1 - p);
    var s = 1 + ease * 1.15 + breathe;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    ctx.translate((W / 2 + px) * DPR, (H / 2 + py + bob) * DPR);
    ctx.rotate(roll);
    ctx.scale(s, s);
    ctx.translate(-W / 2 * DPR, -H / 2 * DPR);

    ctx.drawImage(bakes.sky, 0, 0);

    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.72 + 0.28 * Math.sin(t * 0.0006);
    ctx.drawImage(bakes.rays, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    for (var i = 0; i < bakes.trees.length; i++){
      var L = bakes.trees[i];
      var fade = Math.max(0, 1 - ease * L.depth * 0.85);
      if (fade <= 0.01) continue;
      var ls = 1 + ease * L.depth * 0.55;
      ctx.save();
      ctx.translate(W * 0.5 * DPR, H * 0.5 * DPR);
      ctx.scale(ls, ls);
      ctx.translate(-W * 0.5 * DPR, -H * 0.5 * DPR);
      ctx.globalAlpha = fade;
      ctx.drawImage(L.canvas, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    ctx.drawImage(bakes.ground, 0, 0);

    ctx.globalCompositeOperation = 'screen';
    var fw = bakes.fog.w;
    var off1 = (t * 0.018) % fw;
    var off2 = (t * 0.011 + fw * 0.5) % fw;
    ctx.globalAlpha = 0.55;
    ctx.drawImage(bakes.fog.canvas, -off1, H * 0.60 * DPR);
    ctx.drawImage(bakes.fog.canvas, fw - off1, H * 0.60 * DPR);
    ctx.globalAlpha = 0.42;
    ctx.drawImage(bakes.fog.canvas, -off2, H * 0.34 * DPR);
    ctx.drawImage(bakes.fog.canvas, fw - off2, H * 0.34 * DPR);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#eefaff';
    for (var f = 0; f < flakes.length; f++){
      var fl = flakes[f];
      fl.y += fl.vy * 0.016 * (reduce ? 0.5 : 1);
      fl.x += (fl.vx + Math.sin(t * 0.0006 + fl.ph) * 10) * 0.016;
      if (fl.y > H + 4){ fl.y = -6; fl.x = Math.random() * W; }
      if (fl.x > W + 4) fl.x = -4;
      if (fl.x < -4) fl.x = W + 4;
      var sz = fl.s * (0.6 + fl.z * 1.3) * (1 + ease * 0.8);
      ctx.globalAlpha = fl.a * (0.4 + 0.6 * fl.z);
      ctx.fillRect(fl.x * DPR, fl.y * DPR, sz * DPR, sz * DPR);
    }
    ctx.globalAlpha = 1;

    ctx.drawImage(bakes.vignette, 0, 0);
    ctx.restore();

    if (veil && walk.active){
      var out = p > 0.52 ? Math.min(1, (p - 0.52) / 0.40) : 0;
      veil.style.opacity = String(out);
    }
  }

  /* ---------- loop: 30fps idle, 60fps walking ---------- */
  var last = 0;
  function loop(now){
    requestAnimationFrame(loop);
    if (document.hidden) return;
    var budget = walk.active ? 1000 / 60 : 1000 / 30;
    if (now - last < budget - 1) return;
    last = now;
    if (walk.active){
      FF.walkP = Math.min(1, (now - walk.start) / walk.dur);
      if (FF.walkP >= 1 && !FF.navReady){
        FF.navReady = true;
        if (!FF.noNav) location.href = 'deep.html';
      }
    }
    draw(now);
  }

  function startWalk(){
    if (walk.active) return;
    walk.active = true;
    walk.start = performance.now();
    FF.walking = true;
    gate.classList.add('walking');
    if (hintEl){ hintEl.style.transition = 'opacity .5s ease'; hintEl.style.opacity = '0'; }
    if (titleEl){
      titleEl.style.transition = 'opacity 1.1s ease, transform 1.6s cubic-bezier(.2,.8,.2,1), filter 1.1s ease';
      titleEl.style.opacity = '0';
      titleEl.style.filter = 'blur(12px)';
      titleEl.style.transform = 'translateY(-26px) scale(.96)';
    }
    canvas.style.transition = 'none';
    canvas.style.filter = reduce ? 'brightness(1.2)' : 'brightness(1.28)';
    if (FF.sound) riser();
  }

  /* ---------- pointer ---------- */
  var cur = document.getElementById('cursor'), ring = document.getElementById('ring');
  var cx = -100, cy = -100, rx = -100, ry = -100, hot = false;
  window.addEventListener('pointermove', function(e){
    pointer.tx = e.clientX / W; pointer.ty = e.clientY / H;
    cx = e.clientX; cy = e.clientY;
    var el = e.target;
    var isHot = !!(el && el.closest && el.closest('.gate,.sound,a,button'));
    if (isHot !== hot){
      hot = isHot;
      cur.classList.toggle('hot', hot);
      ring.classList.toggle('hot', hot);
    }
  }, {passive:true});

  (function cursorLoop(){
    pointer.x += (pointer.tx - pointer.x) * 0.06;
    pointer.y += (pointer.ty - pointer.y) * 0.06;
    cur.style.transform = 'translate(' + cx + 'px,' + cy + 'px)';
    rx += (cx - rx) * 0.14;
    ry += (cy - ry) * 0.14;
    ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px)';
    requestAnimationFrame(cursorLoop);
  })();

  gate.addEventListener('click', startWalk);
  gate.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') startWalk(); });

  /* ---------- ambient audio ---------- */
  var actx = null, windGain = null;
  function audioToggle(){
    var btn = document.getElementById('sound');
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
      var len = actx.sampleRate * 4;
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var d = buf.getChannelData(0), v = 0;
      for (var i = 0; i < len; i++){ v = v * 0.985 + (Math.random() * 2 - 1) * 0.015; d[i] = v * 3.2; }
      var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 0.6;
      windGain = actx.createGain(); windGain.gain.value = 0;
      src.connect(lp); lp.connect(windGain); windGain.connect(actx.destination);
      src.start();
      var osc = actx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 47;
      var og = actx.createGain(); og.gain.value = 0.05;
      osc.connect(og); og.connect(actx.destination); osc.start();
    }
    FF.sound = !FF.sound;
    if (actx.state === 'suspended') actx.resume();
    windGain.gain.linearRampToValueAtTime(FF.sound ? 0.22 : 0.0, actx.currentTime + 1.2);
    btn.classList.toggle('on', FF.sound);
    btn.setAttribute('aria-pressed', FF.sound ? 'true' : 'false');
  }
  document.getElementById('sound').addEventListener('click', audioToggle);

  function riser(){
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(70, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(240, actx.currentTime + 1.9);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 2.4);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 2.5);
  }

  /* ---------- title letters ---------- */
  var nameEl = document.getElementById('name');
  if (nameEl){
    var text = nameEl.textContent.trim();
    nameEl.textContent = '';
    for (var i = 0; i < text.length; i++){
      var sp = document.createElement('span');
      sp.className = 'ltr';
      sp.textContent = text[i];
      sp.style.animationDelay = (0.45 + i * 0.055) + 's';
      nameEl.appendChild(sp);
    }
  }

  /* ---------- boot ---------- */
  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(resize, 220);
  });
  resize();
  requestAnimationFrame(loop);
  setTimeout(function(){ veil.classList.add('gone'); }, 120);

  window.__ff = {
    state: FF, walkP: function(){ return FF.walkP; },
    startWalk: startWalk, drawFrame: draw, build: build, bakeAll: bakeAll,
    trees: function(){ return trees.length; },
    flakes: function(){ return flakes.length; },
    noNav: function(v){ FF.noNav = v; },
    perf: function(n){
      var t0 = performance.now();
      for (var i = 0; i < n; i++) draw(i * 16.7);
      return (performance.now() - t0) / n;
    }
  };
})();
</script>
</body>
</html>
